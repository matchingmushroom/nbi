<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample Certificate — BankMastery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #e8e4de;
    font-family: Georgia, serif;
    padding: 20px;
  }
  canvas { max-width: 100%; box-shadow: 0 4px 30px rgba(0,0,0,0.18); border-radius: 6px; }
  .info { margin-top: 20px; text-align: center; color: #444; font-size: 14px; }
  .info p { margin: 4px 0; }
  .btn {
    margin-top: 16px; padding: 12px 32px;
    background: #00288e; color: white; border: none; border-radius: 8px;
    font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
</style>
</head>
<body>
<canvas id="certificate" width="1000" height="707"></canvas>
<div class="info">
  <p>Certificate auto-downloaded as <strong>sample_certificate.png</strong></p>
  <p>If download didn't start, click the button below.</p>
</div>
<button class="btn" onclick="downloadSample()">Download Sample Certificate</button>

<script>
function drawCertificate(ctx, { userName, courseTitle, score, date }) {
  const primary = '#00288e'
  const gold = '#c9a84c'
  const goldLight = '#e8d5a3'
  const light = '#faf8f5'
  const dark = '#1a1a2e'

  ctx.fillStyle = light
  ctx.fillRect(0, 0, 1000, 707)

  ctx.strokeStyle = 'rgba(201, 168, 76, 0.06)'
  ctx.lineWidth = 1
  for (let y = 0; y < 707; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1000, y); ctx.stroke() }

  ctx.strokeStyle = primary
  ctx.lineWidth = 6
  ctx.strokeRect(24, 24, 952, 659)

  ctx.strokeStyle = gold
  ctx.lineWidth = 2
  ctx.strokeRect(34, 34, 932, 639)

  ctx.strokeStyle = primary
  ctx.lineWidth = 1
  ctx.strokeRect(42, 42, 916, 623)

  const drawCorner = (x, y, dx, dy) => {
    ctx.strokeStyle = gold; ctx.lineWidth = 2.5
    ctx.beginPath(); ctx.moveTo(x + dx * 50, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * 50); ctx.stroke()
    ctx.beginPath(); ctx.moveTo(x + dx * 38, y + dy * 12); ctx.lineTo(x + dy * 12, y + dy * 12); ctx.lineTo(x + dy * 12, y + dy * 38); ctx.stroke()
    ctx.beginPath(); ctx.arc(x + dx * 20, y + dy * 20, 3, 0, Math.PI * 2); ctx.fillStyle = gold; ctx.fill()
  }
  drawCorner(24, 24, 1, 1)
  drawCorner(976, 24, -1, 1)
  drawCorner(24, 683, 1, -1)
  drawCorner(976, 683, -1, -1)

  const cx = 500

  ctx.fillStyle = primary
  ctx.font = 'bold 18px Georgia, serif'
  ctx.textAlign = 'center'
  ctx.fillText('BANKMASTERY', cx, 80)

  ctx.fillStyle = gold
  ctx.font = 'italic 11px Georgia, serif'
  ctx.fillText('Learn. Practice. Master.', cx, 98)

  ctx.strokeStyle = gold
  ctx.lineWidth = 1.5
  ctx.beginPath()
  ctx.moveTo(cx - 160, 110); ctx.lineTo(cx + 160, 110); ctx.stroke()

  for (let x = -160; x <= 160; x += 40) {
    ctx.beginPath(); ctx.arc(cx + x, 110, 2, 0, Math.PI * 2); ctx.fillStyle = gold; ctx.fill()
  }

  ctx.fillStyle = primary
  ctx.font = 'bold 38px Georgia, serif'
  ctx.fillText('Certificate of Completion', cx, 172)

  ctx.strokeStyle = gold; ctx.lineWidth = 1.5
  ctx.beginPath(); ctx.moveTo(cx - 140, 190); ctx.lineTo(cx + 140, 190); ctx.stroke()

  ctx.fillStyle = '#555'
  ctx.font = '16px Georgia, serif'
  ctx.fillText('This is to certify that', cx, 232)

  ctx.fillStyle = dark
  ctx.font = 'bold 34px Georgia, serif'
  ctx.fillText(userName, cx, 288)

  ctx.fillStyle = '#555'
  ctx.font = '16px Georgia, serif'
  ctx.fillText('has successfully completed the course', cx, 328)

  ctx.fillStyle = primary
  ctx.font = 'bold 22px Georgia, serif'
  ctx.fillText(courseTitle, cx, 372)

  ctx.fillStyle = '#444'
  ctx.font = '17px Georgia, serif'
  ctx.fillText('Final Score: ' + score + '%', cx, 422)

  ctx.fillStyle = '#888'
  ctx.font = '13px Georgia, serif'
  ctx.fillText('Issued: ' + date, cx, 452)

  ctx.strokeStyle = gold; ctx.lineWidth = 1
  ctx.beginPath(); ctx.moveTo(cx - 100, 472); ctx.lineTo(cx + 100, 472); ctx.stroke()

  // ── Professional Golden Seal ──
  const scx = cx, scy = 575, outerR = 48, innerR = 38

  ctx.beginPath(); ctx.arc(scx, scy, outerR, 0, Math.PI * 2)
  ctx.fillStyle = gold; ctx.fill()
  ctx.strokeStyle = primary; ctx.lineWidth = 2; ctx.stroke()

  ctx.beginPath(); ctx.arc(scx, scy, innerR, 0, Math.PI * 2)
  ctx.fillStyle = '#b8923a'; ctx.fill()
  ctx.strokeStyle = goldLight; ctx.lineWidth = 1.5; ctx.stroke()

  // Curved text "BANKMASTERY"
  ctx.save()
  ctx.translate(scx, scy)
  const text = 'BANKMASTERY'
  const arcR = innerR - 4
  const startAngle = -Math.PI - 0.45
  const endAngle = -0.55
  const totalAngle = endAngle - startAngle
  const chars = text.length
  const step = totalAngle / (chars - 1)
  ctx.font = 'bold 9px Georgia, serif'
  ctx.textAlign = 'center'
  ctx.textBaseline = 'bottom'
  ctx.fillStyle = goldLight
  for (let i = 0; i < chars; i++) {
    const a = startAngle + i * step
    const x = Math.cos(a) * arcR
    const y = Math.sin(a) * arcR
    ctx.save()
    ctx.translate(x, -y)
    ctx.rotate(a + Math.PI / 2)
    ctx.fillText(text[i], 0, 0)
    ctx.restore()
  }
  ctx.restore()

  ctx.fillStyle = goldLight
  ctx.font = 'bold 8px Georgia, serif'
  ctx.textAlign = 'center'
  ctx.textBaseline = 'top'
  ctx.fillText('2024', scx, scy + innerR - 16)

  // Star
  ctx.beginPath()
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? 14 : 6
    const a = (i * Math.PI) / 5 - Math.PI / 2
    const sx = scx + r * Math.cos(a), sy = scy + r * Math.sin(a)
    i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy)
  }
  ctx.closePath()
  ctx.fillStyle = goldLight; ctx.fill()
  ctx.strokeStyle = primary; ctx.lineWidth = 0.5; ctx.stroke()

  ctx.fillStyle = '#aaa'
  ctx.font = '9px Georgia, serif'
  ctx.textAlign = 'center'
  ctx.fillText('BankMastery — Excellence in Banking Education', cx, 670)
}

const canvas = document.getElementById('certificate')
const ctx = canvas.getContext('2d')
const today = new Date().toISOString().split('T')[0]

drawCertificate(ctx, {
  userName: 'John Doe',
  courseTitle: 'Banking Offence and Punishment Act 2064',
  score: 87,
  date: today,
})

function downloadSample() {
  const link = document.createElement('a')
  link.download = 'sample_certificate.png'
  link.href = canvas.toDataURL('image/png')
  document.body.appendChild(link)
  link.click()
  document.body.removeChild(link)
}

window.onload = function() { setTimeout(downloadSample, 500) }
</script>
</body>
</html>
